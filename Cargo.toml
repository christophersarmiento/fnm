[package]
name = "fnm"
version = "1.40.0"
authors = ["Gal Schlezinger <gal@spitfire.co.il>"]
edition = "2021"
build = "build.rs"
license = "GPL-3.0"
repository = "https://github.com/Schniz/fnm"
description = "Fast and simple Node.js version manager"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde", "now"], default-features = false }
tar = "0.4.46"
xz2 = "0.1.7"
node-semver = "2.2.0"
etcetera = "0.11.0"
colored = "3.1.1"
zip = "9.0.2"
tempfile = "3.27.0"
fastrand = "2.5.0"
indoc = "2.0.8"
log = "0.4.34"
env_logger = "0.11.11"
encoding_rs_io = "0.1.8"
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls-no-provider", "brotli"], default-features = false }
webpki-root-certs = "1.0.9"
url = "2.5.8"
sysinfo = "0.39.6"
thiserror = "2.0.21"
clap_complete = "4.6.11"
anyhow = "1.0.104"
indicatif = { version = "0.18.6", features = ["improved_unicode"] }
flate2 = "1.1.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
miette = { version = "7.6.0", features = ["fancy"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
duct = "1.1.2"
test-log = "0.2.21"
http = "1.5.0"

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
csv = "1.4.0"
junction = "2.1.0"

[features]
